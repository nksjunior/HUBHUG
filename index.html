<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HUBHUG | คำทำนาย</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GB86JEEHNY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-GB86JEEHNY');
  </script>

  <!-- html2canvas: ใช้ทำปุ่มเซฟรูป -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    :root{
      --bg1:#0b0b12;
      --bg2:#15152a;
      --card:#1f1f35;
      --card2:#262646;
      --text:#ffffff;
      --muted:rgba(255,255,255,.72);
      --muted2:rgba(255,255,255,.55);
      --accent:#ff4fd8;
      --accent2:#7c4dff;
      --shadow: 0 20px 70px rgba(0,0,0,.45);
      --radius: 22px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      min-height:100vh;
      background:
        radial-gradient(1200px 800px at 20% 15%, rgba(255,79,216,.18), transparent 55%),
        radial-gradient(1200px 800px at 80% 20%, rgba(124,77,255,.22), transparent 55%),
        radial-gradient(1200px 800px at 40% 90%, rgba(0,255,204,.10), transparent 55%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px;
    }

    .app{
      width:min(980px, 100%);
      display:grid;
      grid-template-columns: 1.1fr .9fr;
      gap:18px;
    }

    @media (max-width: 900px){
      .app{grid-template-columns:1fr; gap:16px;}
    }

    .panel{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding:18px;
      overflow:hidden;
    }

    .brand{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }

    .brand .logo{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .dot{
      width:14px;height:14px;border-radius:999px;
      background: radial-gradient(circle at 30% 30%, #fff, rgba(255,255,255,.2) 35%, transparent 60%),
                  linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 0 0 6px rgba(255,79,216,.10);
    }

    h1{
      font-size:18px;
      margin:0;
      letter-spacing:.2px;
    }

    .sub{
      margin:0;
      font-size:13px;
      color:var(--muted);
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap:10px;
      margin-top:12px;
    }

    @media (max-width: 900px){
      .grid{grid-template-columns: repeat(6, 1fr);}
    }
    @media (max-width: 560px){
      .grid{grid-template-columns: repeat(5, 1fr);}
    }

    .cardBtn{
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      border:1px solid rgba(255,255,255,.14);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      color:#fff;
      cursor:pointer;
      transition: transform .08s ease, border-color .12s ease, background .12s ease;
      position:relative;
      overflow:hidden;
    }
    .cardBtn:hover{
      transform: translateY(-2px);
      border-color: rgba(255,255,255,.26);
      background: linear-gradient(180deg, rgba(255,255,255,.11), rgba(255,255,255,.04));
    }
    .cardBtn:active{transform: translateY(0px) scale(.98);}

    .cardBtn .num{
      position:absolute;
      inset:auto 10px 10px auto;
      font-size:12px;
      color:rgba(255,255,255,.65);
    }
    .cardBtn .icon{
      position:absolute;
      inset:12px auto auto 12px;
      width:28px;height:28px;border-radius:12px;
      background: linear-gradient(135deg, rgba(255,79,216,.35), rgba(124,77,255,.35));
      border:1px solid rgba(255,255,255,.18);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
    }

    .resultWrap{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .resultCard{
      border-radius: 26px;
      background:
        radial-gradient(600px 380px at 20% 20%, rgba(255,79,216,.22), transparent 55%),
        radial-gradient(600px 380px at 80% 10%, rgba(124,77,255,.22), transparent 55%),
        linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.14);
      box-shadow: 0 18px 70px rgba(0,0,0,.38);
      padding:18px;
      min-height: 340px;
      position:relative;
      overflow:hidden;
    }

    .badge{
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding:8px 12px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.20);
      color: rgba(255,255,255,.86);
      font-size:12px;
      margin-bottom:12px;
    }

    .title{
      font-size:18px;
      margin:0 0 10px 0;
      letter-spacing:.2px;
    }

    .prediction{
      font-size:22px;
      line-height:1.35;
      font-weight:800;
      margin:0;
    }

    .hint{
      margin:12px 0 0 0;
      font-size:13px;
      color:var(--muted);
    }

    .footerTag{
      position:absolute;
      inset:auto 18px 16px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      color:rgba(255,255,255,.55);
      font-size:12px;
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    button.action{
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color:#fff;
      border-radius: 16px;
      padding:12px 14px;
      cursor:pointer;
      font-weight:700;
      transition: transform .08s ease, border-color .12s ease, background .12s ease;
    }
    button.action:hover{
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.24);
      background: rgba(255,255,255,.09);
    }
    button.action:active{transform: translateY(0px) scale(.99);}

    button.primary{
      background: linear-gradient(135deg, rgba(255,79,216,.85), rgba(124,77,255,.85));
      border-color: rgba(255,255,255,.22);
    }

    .small{
      font-size:12px;
      color:var(--muted2);
      margin:0;
    }

    .hidden{display:none !important;}
  </style>
</head>

<body>
  <div class="app">

    <!-- LEFT: เลือกการ์ด -->
    <section class="panel" id="pickerPanel">
      <div class="brand">
        <div class="logo">
          <div class="dot"></div>
          <div>
            <h1>HUBHUG</h1>
            <p class="sub">เลือกการ์ด หรือสแกน QR เพื่อเปิดคำทำนายเฉพาะใบ</p>
          </div>
        </div>
        <div style="text-align:right">
          <div class="sub">ทั้งหมด 30 ใบ</div>
        </div>
      </div>

      <div class="grid" id="cardGrid"></div>

      <p class="small" style="margin-top:14px;">
        ถ้าคุณเข้าผ่าน QR ระบบจะเปิดคำทำนายให้ทันทีโดยอัตโนมัติ
      </p>
    </section>

    <!-- RIGHT: ผลลัพธ์ -->
    <section class="panel">
      <div class="resultWrap">
        <div class="resultCard" id="captureArea">
          <div class="badge" id="badge">
            🔮 คำทำนายของคุณ
          </div>

          <h2 class="title" id="resultTitle">ยังไม่ได้เลือกการ์ด</h2>
          <p class="prediction" id="predictionText">เลือกการ์ดทางซ้าย หรือสแกน QR Code</p>

          <p class="hint" id="hintText">
            กด “เซฟเป็นรูป” เพื่อแชร์ลง IG Story / TikTok / LINE ได้เลย
          </p>

          <div class="footerTag">
            <span id="footerLeft">HUBHUG • QR Fortune</span>
            <span id="footerRight">#HUBHUG</span>
          </div>
        </div>

        <div class="actions">
          <button class="action primary" id="saveBtn">📸 เซฟเป็นรูป</button>
          <button class="action" id="copyLinkBtn">🔗 คัดลอกลิงก์ใบนี้</button>
          <button class="action" id="randomBtn">🎲 สุ่มใหม่</button>
          <button class="action" id="resetBtn">↩️ กลับหน้าเลือก</button>
        </div>

        <p class="small" id="statusText"></p>
      </div>
    </section>

  </div>

  <script>
    // ====== ตั้งค่าคำทำนาย (ตอนนี้เป็น placeholder) ======
    const predictions = Array.from({ length: 30 }, (_, i) => {
      const n = String(i + 1).padStart(2, "0");
      return `Prediction${n}`;
    });

    // ====== DOM ======
    const cardGrid = document.getElementById("cardGrid");
    const pickerPanel = document.getElementById("pickerPanel");

    const resultTitle = document.getElementById("resultTitle");
    const predictionText = document.getElementById("predictionText");
    const statusText = document.getElementById("statusText");

    const saveBtn = document.getElementById("saveBtn");
    const copyLinkBtn = document.getElementById("copyLinkBtn");
    const randomBtn = document.getElementById("randomBtn");
    const resetBtn = document.getElementById("resetBtn");

    const captureArea = document.getElementById("captureArea");

    // ====== Utilities ======
    function clampId(id){
      const n = Number(id);
      if (!Number.isFinite(n)) return null;
      if (n < 1 || n > 30) return null;
      return n;
    }

    function getIdFromURL(){
      const url = new URL(window.location.href);
      const id = url.searchParams.get("id");
      return clampId(id);
    }

    function setURLId(id){
      const url = new URL(window.location.href);
      url.searchParams.set("id", String(id));
      window.history.replaceState({}, "", url.toString());
    }

    function clearURLId(){
      const url = new URL(window.location.href);
      url.searchParams.delete("id");
      window.history.replaceState({}, "", url.toString());
    }

    function currentShareURL(){
      const url = new URL(window.location.href);
      return url.toString();
    }

    function showStatus(msg){
      statusText.textContent = msg || "";
    }

    // ====== Analytics helper ======
    function trackPredictionView(id){
      // page_view จะถูกส่งโดย GA4 อัตโนมัติอยู่แล้ว
      // แต่เราส่ง event เพิ่ม เพื่อทำ report แยกตาม id ได้ง่าย
      if (typeof gtag === "function"){
        gtag("event", "prediction_view", {
          prediction_id: id,
          page_path: `/HUBHUG/?id=${id}`
        });
      }
    }

    function trackAction(actionName, id){
      if (typeof gtag === "function"){
        gtag("event", actionName, {
          prediction_id: id ?? null
        });
      }
    }

    // ====== Render card grid ======
    function renderCards(){
      cardGrid.innerHTML = "";
      for (let i = 1; i <= 30; i++){
        const btn = document.createElement("button");
        btn.className = "cardBtn";
        btn.type = "button";
        btn.setAttribute("aria-label", `การ์ดใบที่ ${i}`);

        btn.innerHTML = `
          <div class="icon">✨</div>
          <div class="num">#${String(i).padStart(2, "0")}</div>
        `;

        btn.addEventListener("click", () => openPrediction(i, true));
        cardGrid.appendChild(btn);
      }
    }

    // ====== Main: open prediction ======
    let activeId = null;

    function openPrediction(id, userClick=false){
      const safeId = clampId(id);
      if (!safeId) return;

      activeId = safeId;
      const text = predictions[safeId - 1];

      resultTitle.textContent = `คำทำนายใบที่ ${String(safeId).padStart(2, "0")}`;
      predictionText.textContent = text;

      // set URL for QR/link
      setURLId(safeId);

      // ซ่อน panel เลือกการ์ดบนมือถือเพื่อให้เห็นผลชัด ๆ
      if (window.innerWidth <= 900){
        pickerPanel.classList.add("hidden");
      }

      // Analytics
      trackPredictionView(safeId);
      if (userClick) trackAction("pick_card", safeId);

      showStatus("");
    }

    function resetToPicker(){
      activeId = null;
      clearURLId();

      resultTitle.textContent = "ยังไม่ได้เลือกการ์ด";
      predictionText.textContent = "เลือกการ์ดทางซ้าย หรือสแกน QR Code";
      pickerPanel.classList.remove("hidden");

      trackAction("reset_to_picker", null);
      showStatus("");
    }

    // ====== Save as image ======
    async function saveAsImage(){
      if (!activeId){
        showStatus("ยังไม่มีคำทำนายให้เซฟ กรุณาเลือกการ์ดก่อน");
        return;
      }

      showStatus("กำลังสร้างรูป...");

      try{
        // ปรับให้ได้รูปคม ๆ
        const canvas = await html2canvas(captureArea, {
          backgroundColor: null,
          scale: 2,
          useCORS: true
        });

        const dataURL = canvas.toDataURL("image/png");
        const a = document.createElement("a");
        a.href = dataURL;
        a.download = `HUBHUG_Prediction_${String(activeId).padStart(2, "0")}.png`;
        document.body.appendChild(a);
        a.click();
        a.remove();

        trackAction("save_image", activeId);
        showStatus("เซฟรูปเรียบร้อย ✅");
      }catch(err){
        console.error(err);
        showStatus("เซฟรูปไม่สำเร็จ ลองใหม่อีกครั้ง");
      }
    }

    // ====== Copy link ======
    async function copyLink(){
      if (!activeId){
        showStatus("ยังไม่มีลิงก์เฉพาะใบ กรุณาเลือกการ์ดก่อน");
        return;
      }

      try{
        await navigator.clipboard.writeText(currentShareURL());
        trackAction("copy_link", activeId);
        showStatus("คัดลอกลิงก์แล้ว ✅");
      }catch{
        showStatus("คัดลอกไม่ได้ (เบราว์เซอร์ไม่รองรับ)");
      }
    }

    // ====== Random ======
    function randomPick(){
      const id = Math.floor(Math.random() * 30) + 1;
      openPrediction(id, true);
      trackAction("random_pick", id);
    }

    // ====== Bind events ======
    saveBtn.addEventListener("click", saveAsImage);
    copyLinkBtn.addEventListener("click", copyLink);
    randomBtn.addEventListener("click", randomPick);
    resetBtn.addEventListener("click", resetToPicker);

    // ====== Init ======
    renderCards();

    // ถ้ามี id ใน URL (สแกน QR มา) ให้เปิดทันที
    const idFromURL = getIdFromURL();
    if (idFromURL){
      openPrediction(idFromURL, false);
    }else{
      resetToPicker();
    }
  </script>
</body>
</html>
