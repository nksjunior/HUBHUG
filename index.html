<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HUBHUG</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Prompt", sans-serif;
  color: #5b3a28;
  background:
    radial-gradient(circle at top, #fff7ea, #f1dfc8 70%),
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.4),
      rgba(255,255,255,0.4) 2px,
      transparent 2px,
      transparent 6px
    );
  min-height: 100vh;
  display: flex;
  justify-content: center;
}

/* ไฟแคมป์ */
body::after {
  content: "✦ ✦ ✦ ✦ ✦ ✦ ✦";
  position: fixed;
  top: 14px;
  width: 100%;
  text-align: center;
  letter-spacing: 14px;
  font-size: 14px;
  color: #f6c56f;
  opacity: 0.7;
}

.container {
  width: 100%;
  max-width: 420px;
  padding: 24px 16px 40px;
  text-align: center;
}

/* ---------- HEADER ---------- */
.header h2 {
  margin: 0;
  font-size: 22px;
}

.header p {
  margin: 6px 0 0;
  font-size: 14px;
  opacity: 0.85;
}

/* ---------- CARD GRID ---------- */
.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  margin-top: 22px;
}

.card-btn {
  background: linear-gradient(180deg, #fffdf8, #f3e3cf);
  border-radius: 16px;
  padding: 16px 0;
  cursor: pointer;
  font-size: 15px;
  box-shadow:
    0 6px 12px rgba(0,0,0,0.12),
    inset 0 0 6px rgba(255,255,255,0.7);
  transition: transform .25s ease, box-shadow .25s ease;
  user-select: none;
}

.card-btn:hover {
  transform: translateY(-4px) scale(1.05);
  box-shadow: 0 10px 18px rgba(0,0,0,0.18);
}

.card-btn:active {
  transform: scale(0.96);
}

/* ---------- RESULT ---------- */
.hidden { display: none; }

.result-title {
  font-size: 18px;
  margin-top: 10px;
}

.result-sub {
  font-size: 14px;
  margin-top: 6px;
  opacity: 0.75;
}

.result-box {
  margin-top: 14px;
  padding: 22px;
  background: linear-gradient(180deg, #ffffff, #fff3e4);
  border-radius: 22px;
  font-size: 16px;
  line-height: 1.7;
  box-shadow:
    0 10px 24px rgba(0,0,0,0.18),
    inset 0 0 12px rgba(255,255,255,0.85);
  animation: fadeUp .6s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ตัวละคร */
.mascot {
  margin-top: 18px;
  font-size: 42px;
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
  100% { transform: translateY(0); }
}

/* ตัวตกแต่งล่าง */
.little-characters {
  position: fixed;
  bottom: 12px;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 26px;
  pointer-events: none;
  opacity: 0.8;
}

.little-characters span {
  font-size: 20px;
  animation: wiggle 3.5s ease-in-out infinite;
}

.little-characters span:nth-child(2) { animation-delay: .6s; }
.little-characters span:nth-child(3) { animation-delay: 1.2s; }
.little-characters span:nth-child(4) { animation-delay: 1.8s; }

@keyframes wiggle {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.back {
  margin-top: 16px;
  font-size: 14px;
  cursor: pointer;
  opacity: 0.75;
  user-select: none;
}

/* ---------- SAVE BUTTON ---------- */
.save-row {
  margin-top: 14px;
}

.btn {
  border: none;
  cursor: pointer;
  border-radius: 16px;
  padding: 12px 12px;
  font-family: "Prompt", sans-serif;
  font-size: 14px;
  box-shadow: 0 8px 16px rgba(0,0,0,0.14);
  transition: transform .18s ease;
  width: 100%;
  user-select: none;
}

.btn:active { transform: scale(0.98); }

.btn-primary {
  background: linear-gradient(180deg, #ffe2c4, #ffd3a3);
  color: #5b3a28;
}

.hint {
  margin-top: 10px;
  font-size: 12px;
  opacity: 0.7;
  line-height: 1.5;
}
</style>
</head>

<body>

<div class="little-characters">
  <span>🐥</span>
  <span>💗</span>
  <span>✨</span>
  <span>🔮</span>
</div>

<div class="container">

  <!-- หน้าเลือกการ์ด -->
  <div id="selectPage">
    <div class="header">
      <h2>✨ ปิงปิองเสี่ยงฮัก 💘</h2>
      <p>HUBHUG 💗</p>
    </div>

    <div class="grid" id="cardGrid"></div>
  </div>

  <!-- หน้าผลลัพธ์ -->
  <div id="resultPage" class="hidden">
    <div class="result-title" id="cardTitle"></div>
    <div class="result-sub">คำทำนายจากน้องหมี</div>

    <div class="result-box" id="cardText"></div>

    <div class="mascot">🔮🧸✨</div>

    <div class="save-row">
      <button class="btn btn-primary" onclick="saveAsImage()">📷 เซฟเป็นรูป</button>
    </div>

    <div class="hint">
      กดเพื่อดาวน์โหลดรูป แล้วเอาไปแชร์ต่อใน IG / TikTok / X ได้เลย ✨
    </div>

    <div class="back" onclick="goBack()">← เลือกการ์ดใหม่</div>
  </div>

</div>

<script>
/* ------------------------------
   1) คำทำนาย 30 อัน (ชั่วคราว)
   Prediction01 ... Prediction30
-------------------------------- */
const predictions = Array.from({ length: 30 }, (_, i) => {
  return "Prediction" + String(i + 1).padStart(2, "0");
});

/* ------------------------------
   2) สร้างปุ่ม 01-30
-------------------------------- */
const grid = document.getElementById("cardGrid");
for (let i = 1; i <= 30; i++) {
  const div = document.createElement("div");
  div.className = "card-btn";
  div.innerText = String(i).padStart(2,'0');
  div.onclick = () => openCard(i);
  grid.appendChild(div);
}

/* ------------------------------
   3) เปิดการ์ด (กดเลือก)
-------------------------------- */
function openCard(cardNumber) {
  const index = cardNumber - 1;
  showResult(index);

  // เปลี่ยน URL ให้เป็นแบบ ?id=...
  const url = new URL(window.location.href);
  url.searchParams.set("id", String(cardNumber));
  history.replaceState({}, "", url.toString());
}

/* ------------------------------
   4) โชว์ผลลัพธ์
-------------------------------- */
let currentIndex = 0;

function showResult(index) {
  currentIndex = index;

  document.getElementById("selectPage").classList.add("hidden");
  document.getElementById("resultPage").classList.remove("hidden");

  document.getElementById("cardTitle").innerText =
    "คำทำนายที่ " + (index + 1);

  document.getElementById("cardText").innerText = predictions[index];
}

/* ------------------------------
   5) กลับหน้าเลือกการ์ด
-------------------------------- */
function goBack() {
  document.getElementById("resultPage").classList.add("hidden");
  document.getElementById("selectPage").classList.remove("hidden");

  const url = new URL(window.location.href);
  url.searchParams.delete("id");
  history.replaceState({}, "", url.toString());
}

/* ------------------------------
   6) เข้าเว็บผ่าน QR: ถ้ามี ?id= ให้โชว์ทันที
-------------------------------- */
(function autoOpenFromQR() {
  const url = new URL(window.location.href);
  const id = url.searchParams.get("id");
  if (!id) return;

  const num = parseInt(id, 10);
  if (Number.isNaN(num)) return;
  if (num < 1 || num > 30) return;

  showResult(num - 1);
})();

/* ------------------------------
   7) เซฟเป็นรูป (ดาวน์โหลด PNG)
   ขนาด 1080x1920 เหมาะกับ IG Story
-------------------------------- */
function saveAsImage() {
  const title = "คำทำนายที่ " + (currentIndex + 1);
  const text = predictions[currentIndex];

  const canvas = document.createElement("canvas");
  canvas.width = 1080;
  canvas.height = 1920;

  const ctx = canvas.getContext("2d");

  // พื้นหลัง
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, "#fff7ea");
  grad.addColorStop(1, "#f1dfc8");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // กล่องข้อความ
  const boxX = 90;
  const boxY = 420;
  const boxW = canvas.width - 180;
  const boxH = 920;
  const radius = 50;

  roundRect(ctx, boxX, boxY, boxW, boxH, radius);
  ctx.fillStyle = "#ffffff";
  ctx.globalAlpha = 0.92;
  ctx.fill();
  ctx.globalAlpha = 1;

  // หัวข้อ
  ctx.fillStyle = "#5b3a28";
  ctx.font = "bold 54px Prompt, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(title, canvas.width / 2, 300);

  // subtitle
  ctx.font = "32px Prompt, sans-serif";
  ctx.globalAlpha = 0.75;
  ctx.fillText("HUBHUG 💗", canvas.width / 2, 360);
  ctx.globalAlpha = 1;

  // เนื้อหา
  ctx.font = "44px Prompt, sans-serif";
  ctx.textAlign = "left";

  const lines = wrapTextSmart(ctx, text, boxW - 120);
  let y = boxY + 140;

  for (const line of lines) {
    ctx.fillText(line, boxX + 60, y);
    y += 72;
  }

  // มาสคอต
  ctx.textAlign = "center";
  ctx.font = "90px Prompt, sans-serif";
  ctx.fillText("🔮🧸✨", canvas.width / 2, boxY + boxH + 170);

  // ลายน้ำล่าง
  ctx.font = "30px Prompt, sans-serif";
  ctx.globalAlpha = 0.7;
  ctx.fillText("nksjunior.github.io/HUBHUG", canvas.width / 2, 1780);
  ctx.globalAlpha = 1;

  // ดาวน์โหลด
  const a = document.createElement("a");
  a.download = `HUBHUG_${String(currentIndex + 1).padStart(2, "0")}.png`;
  a.href = canvas.toDataURL("image/png");
  a.click();
}

/* wrap ข้อความแบบไม่พังภาษาไทยมาก */
function wrapTextSmart(ctx, text, maxWidth) {
  // ถ้ามีเว้นวรรค ใช้แบบ word wrap
  if (text.includes(" ")) {
    const words = text.split(" ");
    const lines = [];
    let line = "";

    for (const w of words) {
      const testLine = line ? line + " " + w : w;
      if (ctx.measureText(testLine).width > maxWidth && line) {
        lines.push(line);
        line = w;
      } else {
        line = testLine;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  // fallback: ตัดทีละตัวอักษร
  const chars = [...text];
  const lines = [];
  let line = "";

  for (const ch of chars) {
    const testLine = line + ch;
    if (ctx.measureText(testLine).width > maxWidth && line) {
      lines.push(line);
      line = ch;
    } else {
      line = testLine;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
</script>

</body>
</html>
